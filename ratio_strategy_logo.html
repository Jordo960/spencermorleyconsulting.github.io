<head>
  <meta charset="utf-8" />

  <title>Ratio Strategy Logo</title>
  <style>
    :root {
      --warm-stone: #F5F2ED;
      --near-black: #1C1C1A;
      --sage-olive: #6B7C5C;
      --muted-taupe: #B5AFA8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--warm-stone);
      color: var(--near-black);
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo-stage {
      width: min(72vw, 857px);
      padding: clamp(32px, 6vw, 96px);
      display: grid;
      place-items: center;
    }

    .ratio-logo {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
